spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: crossfitbuddy-backend
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  profiles:
      active: ${APP_ENV}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    driver-class-name: org.postgresql.Driver
  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT}
  shutdown: graceful
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security-enabled: true
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
