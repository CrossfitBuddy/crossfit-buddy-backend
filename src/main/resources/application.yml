spring:
  application:
    name: crossfitbuddy-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crossfitbuddy}
    username: ${DB_USERNAME:crossfitbuddy}
    password: ${DB_PASSWORD:crossfitbuddy}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: localhost
    port: 1025 
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false 
          starttls:
            enable: false


server:
  port: ${PORT:8080}
  shutdown: graceful
  fromAddress: test@example.com

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-deploy}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
