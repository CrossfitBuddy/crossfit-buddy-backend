spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: crossfitbuddy-backend
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  profiles:
    active: ${APP_ENV:default}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    parser:
      strict-duplicate-detection: true
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
  mail:
    host: localhost
    port: 1025
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false


server:
  port: ${APP_PORT:8080}
  shutdown: graceful
  fromAddress: test@example.com
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  security-enabled: true
  jwt:
    secret: ${JWT_SECRET:}
#    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:crossfitbuddy}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
#    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:crossfitbuddy-avatars}
