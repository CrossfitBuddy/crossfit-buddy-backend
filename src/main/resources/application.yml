spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: crossfitbuddy-backend
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  profiles:
      active: ${APP_ENV}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    driver-class-name: org.postgresql.Driver
  jackson:
    default-property-inclusion: non_null
    parser:
      strict-duplicate-detection: true
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
  mail:
    host: localhost
    port: 1025
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false


server:
  port: ${APP_PORT}
  shutdown: graceful
  fromAddress: test@example.com
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  security-enabled: true
  jwt:
    secret: ${JWT_SECRET:}
#    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:crossfitbuddy}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
#    allowed-origins: ${CORS_ALLOWED_ORIGINS}
