spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: crossfitbuddy-backend
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  profiles:
    active: ${APP_ENV:default}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    parser:
      strict-duplicate-detection: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    protocol: smtp
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          auth: false
          starttls:
            enable: false


server:
  port: ${APP_PORT:8080}
  shutdown: graceful
  fromAddress: test@example.com
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true


app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    email-confirmation-path: ${EMAIL_CONFIRMATION_PATH:/auth/email-confirmation}
  password-recovery:
    code-ttl: ${PASSWORD_RECOVERY_CODE_TTL:15m}
    max-attempts: ${PASSWORD_RECOVERY_MAX_ATTEMPTS:5}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:crossfitbuddy}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:crossfitbuddy-avatars}
