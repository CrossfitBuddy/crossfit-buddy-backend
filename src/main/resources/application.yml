spring:
  application:
    name: crossfitbuddy-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crossfitbuddy}
    username: ${DB_USERNAME:crossfitbuddy}
    password: ${DB_PASSWORD:crossfitbuddy}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    parser:
      strict-duplicate-detection: true
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:crossfitbuddy}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
