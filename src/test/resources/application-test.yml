spring:
  mail:
    host: localhost
    port: 3025
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

server:
  fromAddress: test@example.com

app:
  minio:
    url: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: crossfitbuddy-avatars
