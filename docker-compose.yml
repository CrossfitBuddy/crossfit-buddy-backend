services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crossfitbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-crossfitbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crossfitbuddy}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025" # SMTP писем
      - "8025:8025" # Веб-интерфейс email сервиса

volumes:
  postgres-data:
